; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno_r4_minima
;default_envs = uno_r3

[env]
framework = arduino
monitor_speed = 115200
build_flags = -DAPP_USB_DEBUG=0

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima

[env:uno_r3]
platform = atmelavr
board = uno

; Debug builds use USB, disable the serial heartbeat timeout and log motor actions.
[env:uno_r4_minima_debug]
extends = env:uno_r4_minima
build_flags = -DAPP_USB_DEBUG=1

[env:uno_r3_debug]
extends = env:uno_r3
build_flags = -DAPP_USB_DEBUG=1
